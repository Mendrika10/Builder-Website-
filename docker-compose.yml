services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mendrika10
      MYSQL_DATABASE: builder_v1
      # Using root via MYSQL_ROOT_PASSWORD; do not set MYSQL_USER=root
    ports:
      - "33060:3306" # avoid binding host port 3306 so local MySQL can be used
    # Change the host path to your desired folder (Windows example: D:/Projet Nante/mysql-data)
    volumes:
      - ./mysql-data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

# Notes:
# - This compose file previously mapped host port 3306 to the container.
#   If you want to use a MySQL server installed locally on your machine (host:3306),
#   stop or remove the `db` container so it doesn't conflict:
#     docker-compose down
#   or comment out/remove the `db` service in this file.
# - The MySQL container is still available on host port 33060 if you need it.
# - Set `DATABASE_URL` in your .env to point to your preferred server (local or docker).
# - To apply Prisma migrations against your local server, ensure the local server is running
#   and then run:
#     npx prisma migrate dev --name add-navigation-image
#     npx prisma generate
