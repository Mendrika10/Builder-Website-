# ============================================================
#  Site.mg — Environnement de développement (rebuild, Sprint 01)
#  FOND-010 : PostgreSQL 16 + Redis
#
#  Usage : docker compose up -d
#  Ports hôte : 6543 (PostgreSQL) et 6380 (Redis) — les ports
#  standard 5432/6379 sont déjà occupés sur cette machine.
#  Adapter DATABASE_URL/REDIS_URL de apps/api/.env en conséquence.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Valeurs par défaut de DEV uniquement — surcharger via .env (jamais commité)
      POSTGRES_USER: ${POSTGRES_USER:-sitemg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitemg_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sitemg}
    ports:
      - "6543:5432" # hôte 6543 → conteneur 5432 (5432 déjà pris en local)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitemg} -d ${POSTGRES_DB:-sitemg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # hôte 6380 → conteneur 6379 (6379 déjà pris en local)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
